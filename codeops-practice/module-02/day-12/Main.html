<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Welcome to Habesha Eatery, your destination for authentic Ethiopian cultural food in Bole, Addis Ababa."
    />
    <title>Habesha Eatery · Bole, Addis Ababa</title>
  </head>

  <body>
    <header>
      <h3>habesha Eatery landing page</h3>
      <nav>
        <a href="contact.html">contact</a>
        <a href="main.html">main</a><br /><br />
      </nav>
    </header>

    <main>
      <img
        src="hero-section-image.jpg"
        width="100%"
        alt="hero-section-image"
        loading="lazy"
      />

      <h1>habesha Eatery landing page</h1>

      <form action="#" method="get">
        <fieldset>
          <legend><h2>reservation form</h2></legend>
          <label for="name">name</label><br />
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g name"
          /><br />

          <label for="phone">phone</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="0911121314"
          /><br />

          <label for="guests">guests</label><br />
          <input
            type="range"
            min="1"
            max="20"
            id="guests"
            name="guests"
          /><br />

          <label for="date">date</label><br />
          <input type="date" id="date" name="date" /><br /><br />

          <input type="submit" value="submit" />
        </fieldset>
      </form>

      <table border="1">
        <caption>
          menu
        </caption>
        <thead>
          <th>scope</th>
          <th>price</th>
        </thead>
        <tr>
          <td>ሽሮ</td>
          <td>100</td>
        </tr>
        <tr>
          <td>ክትፎ</td>
          <td>250</td>
        </tr>
        <tr>
          <td>ቦዘና</td>
          <td>175</td>
        </tr>
        <tr>
          <td>ቅቅል</td>
          <td>300</td>
        </tr>
        <tr>
          <td>በየአይነት</td>
          <td>125</td>
        </tr>
        <tr>
          <td>1 litter ውሃ</td>
          <td>50</td>
        </tr>
      </table>
      <h2>map</h2>

      <iframe
        id="map"
        title="map title tms map "
        width="250px"
        height="250px"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.1380720443262!2d38.76275967399644!3d9.051167988643659!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b8f6cd745d673%3A0xba5f61049290050c!2z4Ymw4Y2I4YiqIOGImOGKruGKleGKlSDhjZbhiIog4Ym04Yqt4YqS4YqtIOGKruGIjOGMhSB8IFRlZmVyaSBNZWtvbm5lbiBQb2x5dGVjaG5pYyBDb2xsZWdl!5e0!3m2!1sen!2set!4v1785499801425!5m2!1sen!2set"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
    <footer>
      <p>&copy; 2024 Habesha Eatery. All rights reserved.</p>
    </footer>
  </body>
</html>
