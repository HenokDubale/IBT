<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <style>
      form {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      fieldset {
        height: 350px;
        width: 400px;
        padding: 35px;
        /* margin-inline: ; */
      }

      input,
      select {
        margin-top: 10px;
      }
      td,th{
        text-align: center;
      }
      #map
      {
        width: 150px;
        height: 150px;
        border: 1px red solid;
      }
      iframe{
        padding-left: 50px;
      }
    </style>
  </head>
  <body>
    <form action="" method="get">
      <fieldset>
        <legend>registration form</legend>
        <label for="f_name">First Name</label>
        <input type="text" name="f_name" id="f_name" required /><br />

        <label for="email">Email</label>
        <input type="text" name="email" id="email" required /><br />

        <label for="password">Password</label>
        <input type="text" name="" id="password" required /><br />

        <label for="check">choose more than one</label>
        <input type="checkbox" name="" id="check" required /><br />

        <label for="radio">choose one</label>
        <input type="radio" name="" id="radio" required /><br />

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          pattern="09[0-9]{8}"
          title="Format: 0911223344"
          name="phone"
          id="phone"
          required
        /><br />

        <label for="stu_id">Student ID</label>
        <input
          type="text"
          pattern="AUTO-[0-9]{4}/R"
          title="Format: AUTO-2531/R"
          name="stu_id"
          id="stu_id"
          required
        /><br />

        <label for="dep" required>Department</label><br />
        <select name="cs" id="dep">
          <option value="cs">computer science</option>
          <option value="automotive">automotive</option>
          <option value="cs">computer mechanical</option>
        </select>
        <br />
        <input type="submit" value="submit" />
      </fieldset>
    </form>

    <h1>table</h1>

            <caption>currency</caption>
            <th>currency </th>
            <th>buy </th>
            <th>sell </th>
        </thead>
        <tr>
            <td>USD</td>
            <td>57.20</td>
            <td>58.34</td>
        </tr>

        <tr style="align-items: center;">
            <td >EUR</td>
            <td >61.05</td>
            <td>62.27</td>
        </tr>
        <tr>
            <td>GBP</td>
            <td>71.40</td>
            <td>72.48</td>
        </tr>

    </table>
